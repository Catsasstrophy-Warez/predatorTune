name: PredatorLab
options:
  bundleIdPrefix: com.daytradescanner.app
  deploymentTarget:
    iOS: "16.0"
targets:
  PredatorLab:
    type: application
    platform: iOS
    sources:
      - path: PredatorLab
        excludes:
          - Info.plist
          - PredatorLabTests/**
    dependencies:
      - target: PredatorLabWidgets
    resources:
      - path: PredatorLab/Resources/ImportedHPL
      - path: PredatorLab/Resources/Fixtures
    info:
      path: PredatorLab/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: HP Tuners CSV Export
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
          - CFBundleTypeName: HP Tuners Log
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.hptuners.hpl
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.hptuners.hpl
            UTTypeDescription: HP Tuners Log
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hpl
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: PredatorLab records your route during a logging session so pulls and events can be placed on a track map.
        NSMotionUsageDescription: PredatorLab records acceleration during a logging session to show g-force alongside your log.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daytradescanner.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PredatorLabWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: PredatorLabWidgets
        excludes:
          - Info.plist
      - path: PredatorLab/Shared/LoggingActivityAttributes.swift
    info:
      path: PredatorLabWidgets/Info.plist
      properties:
        CFBundleDisplayName: PredatorLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daytradescanner.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  PredatorLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PredatorLabUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: PredatorLab
        GENERATE_INFOPLIST_FILE: YES
  PredatorLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PredatorLab/PredatorLabTests
      - path: PredatorLabTests
    dependencies:
      - target: PredatorLab
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: PredatorLab
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PredatorLab:
    build:
      targets:
        PredatorLab: all
        PredatorLabUITests: [test]
        PredatorLabTests: [test]
    test:
      targets:
        - PredatorLabUITests
        - PredatorLabTests
